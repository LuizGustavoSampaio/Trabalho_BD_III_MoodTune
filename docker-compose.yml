version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: moodtune-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - moodtune_mongo_data:/data/db
    networks:
      - moodtune_network

volumes:
  moodtune_mongo_data:
    name: moodtune-db-data

networks:
  moodtune_network:
    name: moodtune-backend-network
    driver: bridge